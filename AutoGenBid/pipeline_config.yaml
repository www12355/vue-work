input:
  bid_docx: 标书文件.docx
output:
  dir: .cache
  clean_dir: output
template:
  search: true
  extract_to: templates/template.docx
task:
  package_id: null
  technical_only: true
proposal_set:
  winning:
    id: bid_00_winning
    name: 中标方案
    tech_stack_id: data_platform
    team_profile_id: large_penetration
    delivery_days: 180
    writing_rules:
    - 全文直接输出投标技术方案正文，不输出过程报告、解释或占位符。
    - 技术路线必须与所选技术栈逐项一致，不得引用未配置的核心技术。
    - 团队配置必须与所选团队方案一致，体现角色职责和投入边界。
    - 工期安排必须按 delivery_days 折算为日历天计划，不再使用月份作为主口径。
    - 所有章节必须围绕招标需求展开，突出可落地实施路径、风险控制和验收指标。
  reference_1:
    id: bid_01
    name: 参考方案 1
    tech_stack_id: reference_java_classic
    team_profile_id: small_research_dev
    delivery_days: 240
    writing_rules:
    - 输出正式、完整且可落地的投标技术方案正文。
    - 技术路线、团队和工期必须完全使用当前方案配置。
    - 所有章节围绕招标需求展开，体现稳定交付和实施边界。
  reference_2:
    id: bid_02
    name: 参考方案 2
    tech_stack_id: reference_php_legacy
    team_profile_id: small_research_dev
    delivery_days: 270
    writing_rules:
    - 输出正式、完整且可落地的投标技术方案正文。
    - 技术路线、团队和工期必须完全使用当前方案配置。
    - 所有章节围绕招标需求展开，体现智能化能力和风险控制。
claude:
  timeout: 600
  max_retries: 3
  min_output_size: 200
  allowed_tools:
  - Read
  - Write
  - Bash
  - Glob
  - Grep
stages:
- id: 0
  name: 标书文档解析
  description: 解析 uploads/ 下核心标书 .docx 文件，提取文本、表格、图片和章节结构
  cache_dir: 01_parsed
  enabled: true
- id: 1
  name: 标书总结
  description: 基于解析结果和参考文件生成标书总结
  cache_dir: 02_summary
  enabled: true
- id: 2
  name: 需求提取
  description: 从标书内容中提取结构化需求清单
  cache_dir: 03_requirements
  enabled: true
- id: 3
  name: 技术章节定位
  description: 用 regex 定位技术方案标号并生成章节编号映射
  cache_dir: 04_template
  enabled: true
- id: 4
  name: 默认格式准备
  description: 直接使用默认 DOCX 格式，不从标书或参考文档学习格式
  cache_dir: 05_format
  enabled: true
- id: 5
  name: 投标策略生成
  description: 按 pipeline_config.yaml 生成主方案策略
  cache_dir: 06_strategies
  enabled: true
- id: 6
  name: 技术方案生成
  description: 使用 AI 生成中标技术方案内容
  cache_dir: 07_bids
  enabled: true
- id: 7
  name: 模板拼接跳过
  description: 已禁用格式模板拼接，仅保留独立文档导出
  cache_dir: 08_filled
  enabled: true
- id: 8
  name: DOCX导出
  description: 使用默认格式导出 docx
  cache_dir: 09_exported
  enabled: true
- id: 9
  name: 应答表生成
  description: 基于技术方案和需求清单生成技术一对一应答表
  cache_dir: 10_response_tables
  enabled: true
- id: 10
  name: 独立文档导出
  description: 导出 output/技术方案.docx 和 技术一对一应答表.docx
  cache_dir: 11_final
  enabled: true
format:
  image_placeholders: true
  reference_docx: 标书/系统性能设计方案评价.docx
  reference_txt: 标书/项目服务方案_01.txt
  default_format_template: null
  generate_toc: true
  generate_response_table: true
